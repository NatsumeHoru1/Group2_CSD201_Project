name: Sync Authors from PHAN_CONG.md

on:
  push:
    paths:
      - 'PHAN_CONG.md'
      - 'bench/sync_authors.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sync_authors.py
        run: |
          python bench/sync_authors.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper/authors.tex paper/paper.tex
          if git diff --staged --quiet; then
            echo "Authors are already up-to-date. No commit needed."
          else
            git commit -m "[Auto] Sync authors from PHAN_CONG.md to paper.tex"
            git push
          fi
